services:
  website:
    build: ./website
    ports:
      - "8005:8080"
    volumes:
      - ./website/src:/var/www/html:z
      - ./website/components:/var/www/components:z
      - ./website/02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./website/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    pull_policy: always
    environment:
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_USER=lunya
      - DB_POSTGRES_PASSWORD=lunya
      - DB_POSTGRES_NAME=lunya
      - ADMIN_USER=lunya
      - ADMIN_PASS=lunya

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=lunya
      - POSTGRES_PASSWORD=lunya
      - POSTGRES_DB=lunya
    ports:
      - 5432:5432

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: luna@localhost
      PGADMIN_DEFAULT_PASSWORD: lunya
    ports:
      - 9001:80
