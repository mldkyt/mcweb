services:
  website:
    build: ./website
    ports:
      - "8005:8080"
    volumes:
      - ./website/src:/var/www/html:z
      - ./website/components:/var/www/components:z
      - ./website/02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./website/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    pull_policy: always
    environment:
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_USER=mldkyt
      - DB_POSTGRES_PASSWORD=mldkyt
      - DB_POSTGRES_NAME=mldkyt
      - ADMIN_USER=mldkyt
      - ADMIN_PASS=mldkyt

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=mldkyt
      - POSTGRES_PASSWORD=mldkyt
      - POSTGRES_DB=mldkyt
    ports:
      - 5432:5432
