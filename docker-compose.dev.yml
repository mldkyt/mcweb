
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=lunya
      - POSTGRES_PASSWORD=lunya
      - POSTGRES_DB=lunya
    ports:
      - 5432:5432

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: lunya@lunya.pet
      PGADMIN_DEFAULT_PASSWORD: lunya
    ports:
      - 9001:80
