services:
  mcstatus:
    build: ./mcstatus1
    env_file: .env
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
  mcweb:
    build: ./website
    env_file: .env
    # ports:
    # - "8005:8080"
    volumes:
      - ./website/src:/var/www/html:z
      - ./website/components:/var/www/components:z
      - ./website/02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./website/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8080"
      DIFFICULTY: "5"
      # SERVE_ROBOTS_TXT: "true"
      TARGET: "http://mcweb:8080"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    # network_mode: host
    restart: always
    pull_policy: always
    ports:
      - "8005:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
