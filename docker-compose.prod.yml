services:
  mcstatus:
    build: ./mcstatus1
    env_file: .env
    networks:
      - postgres
    restart: always

  mcweb:
    build: ./website
    env_file: .env
    ports:
      - "8005:8080"
    volumes:
      - ./website/src:/var/www/html:z
      - ./website/components:/var/www/components:z
      - ./website/02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./website/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - postgres
networks:
  postgres:
    name: postgres
    external: true